<title>Επιμορφωτικά Κέντρα 2026–27</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#F8FAFC; --line:#DDE3EB; --line2:#E9EDF2;
  --ink:#14213A; --ink2:#3C475A; --muted:#6B7688; --faint:#B9C4D4;
  --brand:#0C4C8C; --brand-soft:#E3ECF7; --brand-ink:#083A6B;
  --navy:#14213A; --navy2:#3B4A63; --on-navy:#FFFFFF; --on-navy-muted:#B9C4D4;
  --accent:#B8651B; --accent-soft:#F7ECE1;
  --lvl-bg:#EEF1F5; --focus:#0C4C8C;
  --shadow:0 8px 24px rgba(20,33,58,.14);
  --c-lang:oklch(55% .11 255); --c-craft:oklch(55% .11 60); --c-art:oklch(55% .11 310); --c-fit:oklch(55% .11 170);
  --c-dance:oklch(55% .11 350); --c-know:oklch(55% .11 120); --c-food:oklch(55% .11 85); --c-music:oklch(55% .11 220);
  --c-pro:oklch(55% .03 260); --c-tech:oklch(55% .11 195);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1621; --surface:#171F2C; --surface2:#1D2735; --line:#2A3546; --line2:#232D3C;
    --ink:#E7ECF3; --ink2:#C3CCD9; --muted:#97A3B5; --faint:#55627A;
    --brand:#6FA8E8; --brand-soft:#1B2E47; --brand-ink:#9CC4F2;
    --navy:#0B111A; --navy2:#2A3546; --on-navy:#F1F5FA; --on-navy-muted:#97A3B5;
    --accent:#E0924A; --accent-soft:#3A2A1A;
    --lvl-bg:#243043; --focus:#6FA8E8;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    --c-lang:oklch(72% .11 255); --c-craft:oklch(72% .11 60); --c-art:oklch(72% .11 310); --c-fit:oklch(72% .11 170);
    --c-dance:oklch(72% .11 350); --c-know:oklch(72% .11 120); --c-food:oklch(72% .11 85); --c-music:oklch(72% .11 220);
    --c-pro:oklch(72% .03 260); --c-tech:oklch(72% .11 195);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1621; --surface:#171F2C; --surface2:#1D2735; --line:#2A3546; --line2:#232D3C;
  --ink:#E7ECF3; --ink2:#C3CCD9; --muted:#97A3B5; --faint:#55627A;
  --brand:#6FA8E8; --brand-soft:#1B2E47; --brand-ink:#9CC4F2;
  --navy:#0B111A; --navy2:#2A3546; --on-navy:#F1F5FA; --on-navy-muted:#97A3B5;
  --accent:#E0924A; --accent-soft:#3A2A1A;
  --lvl-bg:#243043; --focus:#6FA8E8;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --c-lang:oklch(72% .11 255); --c-craft:oklch(72% .11 60); --c-art:oklch(72% .11 310); --c-fit:oklch(72% .11 170);
  --c-dance:oklch(72% .11 350); --c-know:oklch(72% .11 120); --c-food:oklch(72% .11 85); --c-music:oklch(72% .11 220);
  --c-pro:oklch(72% .03 260); --c-tech:oklch(72% .11 195);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Commissioner','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}a:hover{color:var(--brand-ink);text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:500}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
@media (max-width:720px){.wrap{padding:0 16px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hdr .wrap{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.brand-t{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.favbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:600;background:var(--surface)}
.favbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;line-height:17px;min-width:17px;text-align:center}
@media (max-width:720px){.brand-s{display:none}.favbtn span.t{display:none}}

/* hero */
.hero{background:var(--navy);color:var(--on-navy)}
.hero .wrap{padding:30px 32px 26px;display:flex;flex-direction:column;gap:16px}
@media (max-width:720px){.hero .wrap{padding:18px 16px 16px;gap:12px}}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero h1{margin:0;font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.stats{display:flex;gap:26px;color:var(--on-navy-muted);font-size:12px}
.stats b{display:block;font-size:20px;color:var(--on-navy);font-weight:500}
@media (max-width:720px){.stats{display:none}}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:0 14px;height:50px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search .clr{color:var(--muted);padding:6px;border-radius:6px}.search .clr:hover{background:var(--surface2)}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--on-navy-muted)}
.quick button{padding:4px 10px;border:1px solid var(--navy2);border-radius:999px;color:var(--on-navy);font-size:13px}
.quick button:hover{border-color:var(--on-navy-muted)}

/* body layout */
.body{display:grid;grid-template-columns:272px minmax(0,1fr);gap:32px;padding-top:26px;padding-bottom:56px}
@media (max-width:960px){.body{grid-template-columns:1fr;gap:16px;padding-top:14px}}

/* facets */
.facets{display:flex;flex-direction:column;gap:24px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:4px}
.fs{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.eyebrow button{font-size:11px;letter-spacing:0;text-transform:none;color:var(--brand);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chip .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:var(--on-navy-muted)}
.chip:disabled{opacity:.4;cursor:default}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.days button{padding:8px 0;font-size:13px;font-weight:600;border-left:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.days button:first-child{border-left:0}
.days button small{font-size:10px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.days button[aria-pressed="true"]{background:var(--brand);color:#fff}
.days button[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.days button:disabled{opacity:.4}
.flist{display:flex;flex-direction:column;gap:2px}
.fl{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;font-size:14px;width:100%;text-align:left;color:var(--ink)}
.fl:hover{background:var(--surface2)}
.fl[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.fl .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fl:disabled{opacity:.4;cursor:default}
.fl .l{display:flex;align-items:center;gap:8px;min-width:0}
.fl .l span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:2px;flex:none;background:var(--c)}
.sublist{max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:4px;background:var(--surface)}
.sublist .fl{font-size:13px;padding:6px 8px}
.subsearch{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.clearall{font-size:13px;color:var(--brand);font-weight:600;text-align:left}

/* mobile sheet */
.fbtn{display:none}
.sheet-bg{display:none}
@media (max-width:960px){
  .fbtn{display:inline-flex;align-items:center;gap:6px}
  .facets{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(20,33,58,.22);padding:16px 16px 20px;z-index:50;transform:translateY(105%);transition:transform .22s ease;overflow:auto}
  .facets.open{transform:none}
  .sheet-bg{display:block;position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center}
  .sheet-head b{font-size:16px;font-weight:800}
  .apply{height:46px;border-radius:10px;background:var(--navy);color:var(--on-navy);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
}
@media (min-width:961px){.sheet-head,.apply{display:none}}

/* results */
.res{display:flex;flex-direction:column;gap:14px;min-width:0}
.tb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-size:14px;color:var(--ink2)}.count b{color:var(--ink)}
.tb-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sort{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sort select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.views button{padding:7px 12px;font-size:13px}
.active{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.active .chip{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);font-weight:600}
.active .chip svg{opacity:.7}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* groups */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:16px;width:100%;text-align:left;color:var(--ink)}
.gh:hover{background:var(--surface2)}
.gh .l{display:flex;align-items:center;gap:12px;min-width:0}
.gh .sw{width:12px;height:12px}
.gh .t{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.gh .s{font-size:13px;color:var(--muted)}
.gh .r{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex:none}
.gh .r .num{display:none}
@media (max-width:720px){.gh .r .num{display:inline;font-variant-numeric:tabular-nums}}
.gh .r svg{transition:transform .15s}
.grp.open .gh .r svg{transform:rotate(180deg)}
.gbody{display:none}.grp.open .gbody{display:block}
.rows{width:100%;border-collapse:collapse}
.rows th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 18px;background:var(--surface2);border-top:1px solid var(--line2);white-space:nowrap}
.rows td{padding:10px 18px;border-top:1px solid var(--line2);font-size:14px;vertical-align:middle}
.rows tr:hover td{background:var(--surface2)}
.rows th.sortable{cursor:pointer;user-select:none}
.rows th.sortable:hover{color:var(--ink)}
.rows th .dir{display:inline-block;margin-left:4px;color:var(--brand)}
.lvl{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--lvl-bg);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.day{font-weight:600;font-size:13px;white-space:nowrap}
.star{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--faint)}
.star:hover{background:var(--accent-soft);color:var(--accent)}
.star[aria-pressed="true"]{color:var(--accent)}
.more{display:block;width:100%;text-align:left;padding:10px 18px;border-top:1px solid var(--line2);font-size:13px;color:var(--brand);font-weight:600}
.more:hover{background:var(--surface2)}
.gtools{display:flex;gap:14px;font-size:13px}
.gtools button{color:var(--brand);font-weight:600}
.tw{overflow-x:auto}
.cellsub{display:flex;flex-direction:column;gap:1px}
.cellsub small{color:var(--muted);font-size:12px}
.cellc{max-width:420px}
@media (max-width:720px){
  .rows thead{display:none}
  .rows tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-top:1px solid var(--line2)}
  .rows td{display:block;padding:0;border:0;font-size:13px}
  .rows td.c-sub{grid-column:1/-1;font-size:15px;font-weight:700}
  .rows td.c-center{grid-column:1/-1;color:var(--ink2)}
  .rows td.c-star{grid-row:1;grid-column:2}
  .rows td.c-meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
}
@media (min-width:721px){.rows td.c-meta{display:none}}
@media (max-width:720px){.rows td.c-dist,.rows td.c-day,.rows td.c-time,.rows td.c-lvl{display:none}.gh .r .txt{display:none}.gh{padding:12px 14px}.gh .t{font-size:16px}}

/* week */
.week{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.wcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.wh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;border-bottom:2px solid var(--ink);position:sticky;top:60px;background:var(--bg);z-index:1}
.wh b{font-size:15px;font-weight:800}.wh span{font-size:12px;color:var(--muted)}
.ev{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.ev .t{font-size:12px;color:var(--ink)}
.ev .n{font-size:13px;font-weight:600;line-height:1.25;padding-right:22px}
.ev .c{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .d{font-size:11px;color:var(--muted)}
.ev .star{position:absolute;top:4px;right:4px;width:24px;height:24px}
.wmore{font-size:12px;color:var(--brand);font-weight:600;text-align:left;padding:6px 4px}

/* centers */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.dh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:10px 0 -4px;display:flex;align-items:center;gap:10px}
.dh::after{content:"";flex:1;height:1px;background:var(--line)}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cc .t{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.cc .s{font-size:12px;color:var(--muted)}
.cc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cc li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px}
.cc li .sw{margin-top:0}
.cc li .m{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.cc li .lvl{font-size:11px;padding:1px 6px}

.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:20px 0 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="hdr">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
      <div style="min-width:0"><div class="brand-t" data-t="title"></div><div class="brand-s" data-t="subtitle"></div></div>
    </div>
    <div class="hdr-r">
      <div class="seg" id="lang" role="group" aria-label="Language">
        <button data-lang="el">ΕΛ</button><button data-lang="en">EN</button><button data-lang="ru">RU</button>
      </div>
      <button class="favbtn" id="favToggle" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="color:var(--accent)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"></path></svg>
        <span class="t" data-t="saved"></span><span class="badge" id="favCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-top">
      <h1 data-t="h1"></h1>
      <div class="stats" id="stats"></div>
    </div>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <button class="clr" id="qClear" hidden aria-label="Clear"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </label>
    <div class="quick" id="quick"></div>
  </div>
</section>

<div class="sheet-bg" id="sheetBg"></div>
<main class="wrap body">
  <aside class="facets" id="facets" aria-label="Filters">
    <div class="sheet-head"><b data-t="filters"></b><button class="clearall" id="clearAllM" data-t="clear"></button></div>
    <div class="fs"><div class="eyebrow"><span data-t="district"></span></div><div class="chips" id="fDist"></div></div>
    <div class="fs"><div class="eyebrow"><span data-t="day"></span></div><div class="days" id="fDay"></div></div>
    <div class="fs"><div class="eyebrow"><span data-t="startTime"></span></div><div class="chips" id="fTod"></div></div>
    <div class="fs"><div class="eyebrow"><span data-t="category"></span></div><div class="flist" id="fCat"></div></div>

function ru_pl(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}

/* ---------- data prep ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/[’'΄`«»]/g,' ').replace(/\s+/g,' ').trim();
const toMin = t => {const [h,m]=t.split(':').map(Number);return h*60+m};
const SUBJ = DATA.subjects.map((s,i)=>({...s,id:i,n:norm(s.el+' '+s.t+' '+s.en+' '+s.ru)}));
const ROWS = DATA.rows.map(r=>{
  const s=SUBJ[r[1]], start=toMin(r[5]);
  const tod = start<12*60?'am':start<18*60?'pm':'ev';
  const lv = r[3];
  const lvset = lv==='—'?['—']:lv.split('+').map(x=>x.trim()).flatMap(x=>x==='Γ+'?['Γ+','Γ']:[x]);
  return {id:r[0],s,sid:r[1],dist:r[2],lvl:lv,lvset,center:r[4],start:r[5],end:r[6],startMin:start,days:r[7],tod,
    n:norm(s.el+' '+s.en+' '+s.ru+' '+r[4]+' '+DIST[r[2]].el+' '+DIST[r[2]].en+' '+DIST[r[2]].ru+' '+r[7].map(d=>DAYS[d].el+' '+DAYS[d].en+' '+DAYS[d].ru).join(' ')+' '+r[5])};
});
const CENTERS = new Set(ROWS.map(r=>r.center)).size;

/* ---------- state ---------- */
const S = {q:'',cat:new Set(),sub:new Set(),dist:new Set(),day:new Set(),tod:new Set(),lvl:new Set(),fav:false,view:'groups',sort:'name',lang:'el',open:new Set(),expanded:new Set(),listSort:'sub',listDir:1,subQ:'',weekMore:new Set()};
let FAV = new Set();
try{FAV=new Set(JSON.parse(localStorage.getItem('epi.fav')||'[]'))}catch(e){}
try{const l=localStorage.getItem('epi.lang');if(l&&T[l])S.lang=l}catch(e){}
function saveFav(){try{localStorage.setItem('epi.fav',JSON.stringify([...FAV]))}catch(e){}}
const t = k => T[S.lang][k];
const L = o => o[S.lang] || o.el;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc = s => s.toLowerCase().replace(/(^|[\s(«\-–])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()); // titlecase Greek caps
const subName = s => s.t;
const subTr = s => S.lang==='el' ? s.en : L(s);
const dayLabel = r => r.days.map(d=>L(DAYS[d])).join(' / ');
const timeLabel = r => `${r.start}–${r.end}`;

/* URL hash */
function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.toString())return;
  S.q=h.get('q')||'';
  const sets=['cat','sub','dist','day','tod','lvl'];
  for(const k of sets){S[k]=new Set((h.get(k)||'').split(',').filter(Boolean).map(v=>k==='sub'||k==='day'?Number(v):v))}
  S.fav=h.get('fav')==='1';
  if(h.get('view'))S.view=h.get('view');
  if(h.get('sort'))S.sort=h.get('sort');
  if(h.get('lang')&&T[h.get('lang')])S.lang=h.get('lang');
}
function writeHash(){
  const h=new URLSearchParams();
  if(S.q)h.set('q',S.q);
  for(const k of ['cat','sub','dist','day','tod','lvl'])if(S[k].size)h.set(k,[...S[k]].join(','));
  if(S.fav)h.set('fav','1');
  if(S.view!=='groups')h.set('view',S.view);
  if(S.sort!=='name')h.set('sort',S.sort);
  if(S.lang!=='el')h.set('lang',S.lang);
  const str=h.toString();
  history.replaceState(null,'',str?'#'+str:location.pathname+location.search);
}

/* ---------- filtering ---------- */
function matches(r,skip){
  if(skip!=='q'&&S.q){for(const w of S.qWords)if(!r.n.includes(w))return false}
  if(skip!=='cat'&&S.cat.size&&!S.cat.has(r.s.cat))return false;
  if(skip!=='sub'&&S.sub.size&&!S.sub.has(r.sid))return false;
  if(skip!=='dist'&&S.dist.size&&!S.dist.has(r.dist))return false;
  if(skip!=='day'&&S.day.size&&!r.days.some(d=>S.day.has(d)))return false;
  if(skip!=='tod'&&S.tod.size&&!S.tod.has(r.tod))return false;
  if(skip!=='lvl'&&S.lvl.size&&!r.lvset.some(l=>S.lvl.has(l)))return false;
  if(skip!=='fav'&&S.fav&&!FAV.has(r.id))return false;
  return true;
}
function counts(key,getter,multi){
  const m=new Map();
  for(const r of ROWS){if(!matches(r,key))continue;const v=getter(r);if(multi){for(const x of v)m.set(x,(m.get(x)||0)+1)}else m.set(v,(m.get(v)||0)+1)}
  return m;
}
const nActive = () => S.cat.size+S.sub.size+S.dist.size+S.day.size+S.tod.size+S.lvl.size+(S.fav?1:0);

/* ---------- rendering: facets ---------- */
function btn(cls,pressed,label,n,attrs){return `<button class="${cls}" aria-pressed="${pressed}" ${attrs} ${n===0&&!pressed?'disabled':''}>${label}${n!==undefined?` <span class="n">${n}</span>`:''}</button>`}
function renderFacets(){
  const cd=counts('dist',r=>r.dist);
  document.getElementById('fDist').innerHTML=DIST_ORDER.map(k=>btn('chip',S.dist.has(k),L(DIST[k]),cd.get(k)||0,`data-f="dist" data-v="${k}"`)).join('');
  const cdy=counts('day',r=>r.days,true);
  document.getElementById('fDay').innerHTML=[1,2,3,4,5,6].map(d=>`<button aria-pressed="${S.day.has(d)}" data-f="day" data-v="${d}" title="${L(DAYS[d])}" ${!(cdy.get(d)||0)&&!S.day.has(d)?'disabled':''}>${DAYS[d].s[S.lang]}<small>${cdy.get(d)||0}</small></button>`).join('');
  const ct=counts('tod',r=>r.tod);
  document.getElementById('fTod').innerHTML=Object.keys(TOD).map(k=>btn('chip',S.tod.has(k),`${L(TOD[k])} <span style="opacity:.6;font-weight:400">${TOD[k].h}</span>`,ct.get(k)||0,`data-f="tod" data-v="${k}"`)).join('');
  const cc=counts('cat',r=>r.s.cat);
  document.getElementById('fCat').innerHTML=CAT_ORDER.map(k=>`<button class="fl" aria-pressed="${S.cat.has(k)}" data-f="cat" data-v="${k}" ${!(cc.get(k)||0)&&!S.cat.has(k)?'disabled':''}><span class="l"><span class="sw" style="--c:var(--c-${k})"></span><span>${L(CATS[k])}</span></span><span class="n">${cc.get(k)||0}</span></button>`).join('');
  const cs=counts('sub',r=>r.sid);
  const sq=norm(S.subQ);
  let subs=SUBJ.filter(s=>(cs.get(s.id)||0)>0||S.sub.has(s.id)).filter(s=>!sq||s.n.includes(sq));
  if(S.cat.size)subs=subs.filter(s=>S.cat.has(s.cat)||S.sub.has(s.id));
  subs.sort((a,b)=>(S.sub.has(b.id)-S.sub.has(a.id))||a.el.localeCompare(b.el,'el'));
  document.getElementById('fSub').innerHTML=subs.map(s=>`<button class="fl" aria-pressed="${S.sub.has(s.id)}" data-f="sub" data-v="${s.id}" title="${esc(subTr(s))}"><span class="l"><span class="sw" style="--c:var(--c-${s.cat})"></span><span>${esc(S.lang==='el'?subName(s):L(s))}</span></span><span class="n">${cs.get(s.id)||0}</span></button>`).join('')||`<div style="padding:8px;color:var(--muted);font-size:13px">—</div>`;
  document.getElementById('subClear').hidden=!S.sub.size;
  const cl=counts('lvl',r=>r.lvset,true);
  document.getElementById('fLvl').innerHTML=LVLS.map(l=>btn('chip',S.lvl.has(l),L(LVL_T[l]),cl.get(l)||0,`data-f="lvl" data-v="${l}"`)).join('');
  const n=nActive();
  document.getElementById('fbtnN').textContent=n||'';
  document.getElementById('clearAll').hidden=!(n||S.q);
  document.getElementById('clearAllM').hidden=!(n||S.q);
}

/* ---------- rendering: active chips ---------- */
function renderActive(){
  const x='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>';
  const items=[];
  for(const v of S.cat)items.push(['cat',v,L(CATS[v])]);
  for(const v of S.sub)items.push(['sub',v,S.lang==='el'?subName(SUBJ[v]):L(SUBJ[v])]);
  for(const v of S.dist)items.push(['dist',v,L(DIST[v])]);
  for(const v of [...S.day].sort())items.push(['day',v,L(DAYS[v])]);
  for(const v of S.tod)items.push(['tod',v,L(TOD[v])]);
  for(const v of S.lvl)items.push(['lvl',v,L(LVL_T[v])]);
  if(S.fav)items.push(['fav','1',t('favOnly')]);
  document.getElementById('active').innerHTML=items.map(([f,v,l])=>`<button class="chip" data-rm="${f}" data-v="${esc(v)}">${esc(l)} ${x}</button>`).join('');
}

const starSvg='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"></path></svg>';
const star = r => `<button class="star" data-fav="${r.id}" aria-pressed="${FAV.has(r.id)}" aria-label="★">${FAV.has(r.id)?starSvg.replace('fill="none"','fill="currentColor"'):starSvg}</button>`;

/* ---------- sorting ---------- */
function cmpRows(a,b,key){
  switch(key){
    case 'sub': return a.s.el.localeCompare(b.s.el,'el')||cmpRows(a,b,'dist');
    case 'dist': return DIST_ORDER.indexOf(a.dist)-DIST_ORDER.indexOf(b.dist)||a.center.localeCompare(b.center,'el')||cmpRows(a,b,'time');
    case 'center': return a.center.localeCompare(b.center,'el')||cmpRows(a,b,'time');
    case 'day': case 'time': return a.days[0]-b.days[0]||a.startMin-b.startMin||a.s.el.localeCompare(b.s.el,'el');
    case 'lvl': return a.lvl.localeCompare(b.lvl,'el')||cmpRows(a,b,'sub');
  }
  return 0;
}
function rowSortKey(){return {name:'sub',count:'sub',dist:'dist',time:'time',center:'center'}[S.sort]}

/* ---------- rendering: rows table ---------- */
function rowsTable(rows,opts={}){
  const showSub=!!opts.showSub, sortable=!!opts.sortable;
  const th=(k,label)=>sortable?`<th class="sortable" data-ls="${k}">${label}${S.listSort===k?`<span class="dir">${S.listDir>0?'↑':'↓'}</span>`:''}</th>`:`<th>${label}</th>`;
  const head=`<thead><tr>${showSub?th('sub',t('col_sub')):''}${th('dist',t('col_dist'))}${th('center',t('col_center'))}${th('day',t('col_day'))}${th('time',t('col_time'))}${th('lvl',t('col_lvl'))}<th></th></tr></thead>`;
  const body=rows.map(r=>`<tr>${showSub?`<td class="c-sub"><div class="cellsub"><span>${esc(subName(r.s))}</span>${S.lang!=='el'?`<small>${esc(L(r.s))}</small>`:''}</div></td>`:''}<td class="c-dist">${L(DIST[r.dist])}</td><td class="c-center cellc">${esc(r.center)}</td><td class="c-day"><span class="day">${dayLabel(r)}</span></td><td class="c-time mono">${timeLabel(r)}</td><td class="c-lvl"><span class="lvl">${r.lvl}</span></td><td class="c-star">${star(r)}</td><td class="c-meta"><span class="day">${dayLabel(r)}</span><span class="mono">${timeLabel(r)}</span><span class="lvl">${r.lvl}</span><span style="color:var(--muted)">${L(DIST[r.dist])}</span></td></tr>`).join('');
  return `<div class="tw"><table class="rows">${head}<tbody>${body}</tbody></table></div>`;
}

/* ---------- views ---------- */
function viewGroups(rows){
  const g=new Map();
  for(const r of rows){if(!g.has(r.sid))g.set(r.sid,[]);g.get(r.sid).push(r)}
  let groups=[...g.entries()].map(([sid,rs])=>({s:SUBJ[sid],rs}));
  if(S.sort==='count')groups.sort((a,b)=>b.rs.length-a.rs.length||a.s.el.localeCompare(b.s.el,'el'));
  else groups.sort((a,b)=>a.s.el.localeCompare(b.s.el,'el'));
  const key=rowSortKey();
  const autoOpen=groups.length<=3||rows.length<=40;
  const LIM=8;
  const html=groups.map(({s,rs})=>{
    rs.sort((a,b)=>cmpRows(a,b,key==='sub'?'dist':key));
    const open=S.open.has(s.id)||(autoOpen&&!S.closed.has(s.id));
    const centers=new Set(rs.map(r=>r.center)).size;
    const exp=S.expanded.has(s.id);
    const shown=exp?rs:rs.slice(0,LIM);
    return `<div class="grp${open?' open':''}" data-g="${s.id}">
      <button class="gh" data-toggle="${s.id}" aria-expanded="${open}"><span class="l"><span class="sw" style="--c:var(--c-${s.cat})"></span><span><div class="t">${esc(subName(s))}</div><div class="s">${esc(S.lang==='el'?s.en+' · '+s.ru:(S.lang==='en'?s.ru:s.en))}</div></span></span><span class="r"><span class="txt">${t('inCenters')(rs.length,centers)}</span><span class="num">${rs.length}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></span></button>
      <div class="gbody">${open?rowsTable(shown):''}${open&&rs.length>LIM?`<button class="more" data-more="${s.id}">${exp?t('less'):t('more')(rs.length-LIM)}</button>`:''}</div></div>`;
  }).join('');
  return `<div class="gtools"><button data-ga="open">${t('expandAll')}</button><button data-ga="close">${t('collapseAll')}</button></div>${html}`;
}
function viewList(rows){
  rows=[...rows].sort((a,b)=>S.listDir*cmpRows(a,b,S.listSort));
  return `<div class="grp">${rowsTable(rows,{showSub:true,sortable:true})}</div>`;
}
function viewWeek(rows){
  const cols=[1,2,3,4,5,6].map(d=>({d,rs:rows.filter(r=>r.days.includes(d)).sort((a,b)=>a.startMin-b.startMin||a.s.el.localeCompare(b.s.el,'el'))}));
  const LIM=60;
  return `<div class="week">${cols.map(({d,rs})=>{
    const more=S.weekMore.has(d);const shown=more?rs:rs.slice(0,LIM);
    return `<div class="wcol"><div class="wh"><b>${L(DAYS[d])}</b><span class="mono">${rs.length}</span></div>${shown.map(r=>`<div class="ev" style="--c:var(--c-${r.s.cat})"><span class="t mono">${timeLabel(r)}</span><span class="n">${esc(subName(r.s))} · ${r.lvl}</span><span class="c" title="${esc(r.center)}">${esc(r.center)}</span><span class="d">${L(DIST[r.dist])}${r.days.length>1?' · '+dayLabel(r):''}</span>${star(r)}</div>`).join('')}${rs.length>LIM&&!more?`<button class="wmore" data-wmore="${d}">${t('more')(rs.length-LIM)}</button>`:''}</div>`}).join('')}</div>`;
}
function viewCenters(rows){
  const byD=new Map();
  for(const r of rows){const k=r.dist+'|'+r.center;if(!byD.has(k))byD.set(k,{dist:r.dist,center:r.center,rs:[]});byD.get(k).rs.push(r)}
  const cs=[...byD.values()].sort((a,b)=>DIST_ORDER.indexOf(a.dist)-DIST_ORDER.indexOf(b.dist)||a.center.localeCompare(b.center,'el'));
  let out='',cur=null,buf=[];
  const flush=()=>{if(buf.length){out+=`<div class="dh">${L(DIST[cur])} · ${buf.length}</div><div class="cgrid">${buf.join('')}</div>`;buf=[]}};
  for(const c of cs){
    if(c.dist!==cur){flush();cur=c.dist}
    c.rs.sort((a,b)=>a.s.el.localeCompare(b.s.el,'el')||a.days[0]-b.days[0]||a.startMin-b.startMin);
    buf.push(`<div class="cc"><div><div class="t">${esc(c.center)}</div><div class="s">${L(DIST[c.dist])} · ${c.rs.length} ${t('sections')}</div></div><ul>${c.rs.map(r=>`<li><span class="sw" style="--c:var(--c-${r.s.cat})"></span><span>${esc(subName(r.s))} <span class="lvl">${r.lvl}</span></span><span class="m"><span class="day">${r.days.map(d=>DAYS[d].s[S.lang]).join('/')}</span><span class="mono">${r.start}</span>${star(r)}</span></li>`).join('')}</ul></div>`);
  }
  flush();
  return out;
}

/* ---------- main update ---------- */
S.closed=new Set();
function update(){
  S.qWords=norm(S.q).split(' ').filter(Boolean);
  writeHash();
  renderFacets();renderActive();
  const rows=ROWS.filter(r=>matches(r));
  const g=new Set(rows.map(r=>r.sid)).size, c=new Set(rows.map(r=>r.center)).size;
  document.getElementById('count').innerHTML=t('count')(rows.length,g,c);
  document.getElementById('apply').textContent=t('apply')(rows.length);
  document.getElementById('favCount').textContent=FAV.size;
  document.getElementById('favToggle').setAttribute('aria-pressed',S.fav);
  document.getElementById('qClear').hidden=!S.q;
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  const out=document.getElementById('out');
  if(!rows.length){out.innerHTML=`<div class="empty"><b>${t('noRes')}</b>${S.fav&&!FAV.size?t('savedEmpty'):t('noResHint')}</div>`;return}
  out.innerHTML=S.view==='list'?viewList(rows):S.view==='week'?viewWeek(rows):S.view==='centers'?viewCenters(rows):viewGroups(rows);
}

/* ---------- events ---------- */
function toggleSet(set,v){set.has(v)?set.delete(v):set.add(v)}
document.getElementById('facets').addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  const f=b.dataset.f;let v=b.dataset.v;if(f==='sub'||f==='day')v=Number(v);
  toggleSet(S[f],v);
  if(f==='cat'){for(const sid of [...S.sub])if(!S.cat.has(SUBJ[sid].cat)&&S.cat.size)S.sub.delete(sid)}
  S.open=new Set();S.closed=new Set();S.expanded=new Set();S.weekMore=new Set();
  update();
});
document.getElementById('subQ').addEventListener('input',e=>{S.subQ=e.target.value;renderFacets()});
document.getElementById('subClear').onclick=()=>{S.sub=new Set();update()};
const clearAll=()=>{for(const k of ['cat','sub','dist','day','tod','lvl'])S[k]=new Set();S.q='';S.fav=false;S.subQ='';document.getElementById('q').value='';document.getElementById('subQ').value='';S.open=new Set();S.closed=new Set();S.expanded=new Set();update()};
document.getElementById('clearAll').onclick=clearAll;document.getElementById('clearAllM').onclick=clearAll;
let qt;document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;S.open=new Set();S.closed=new Set();update()},120)});
document.getElementById('qClear').onclick=()=>{S.q='';document.getElementById('q').value='';update();document.getElementById('q').focus()};
document.getElementById('sort').onchange=e=>{S.sort=e.target.value;update()};
document.getElementById('views').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;S.view=b.dataset.view;update()};
document.getElementById('favToggle').onclick=()=>{S.fav=!S.fav;update()};
document.getElementById('lang').onclick=e=>{const b=e.target.closest('[data-lang]');if(!b)return;S.lang=b.dataset.lang;try{localStorage.setItem('epi.lang',S.lang)}catch(x){}renderStatic();update()};
document.getElementById('active').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;const f=b.dataset.rm;if(f==='fav')S.fav=false;else{let v=b.dataset.v;if(f==='sub'||f==='day')v=Number(v);S[f].delete(v)}update()};
document.getElementById('out').addEventListener('click',e=>{
  const fav=e.target.closest('[data-fav]');
  if(fav){const id=Number(fav.dataset.fav);FAV.has(id)?FAV.delete(id):FAV.add(id);saveFav();
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',FAV.has(id));b.innerHTML=FAV.has(id)?starSvg.replace('fill="none"','fill="currentColor"'):starSvg});
    document.getElementById('favCount').textContent=FAV.size;if(S.fav)update();return}
  const tg=e.target.closest('[data-toggle]');
  if(tg){const id=Number(tg.dataset.toggle);const grp=tg.closest('.grp');const isOpen=grp.classList.contains('open');
    if(isOpen){S.open.delete(id);S.closed.add(id)}else{S.open.add(id);S.closed.delete(id)}
    const rows=ROWS.filter(r=>matches(r));const out=document.getElementById('out');out.innerHTML=viewGroups(rows);
    const el=out.querySelector(`[data-g="${id}"]`);if(el&&!isOpen){const y=el.getBoundingClientRect().top;if(y<70)el.scrollIntoView({block:'start'})}return}
  const mo=e.target.closest('[data-more]');
  if(mo){const id=Number(mo.dataset.more);toggleSet(S.expanded,id);document.getElementById('out').innerHTML=viewGroups(ROWS.filter(r=>matches(r)));return}
  const ga=e.target.closest('[data-ga]');
  if(ga){const rows=ROWS.filter(r=>matches(r));const ids=new Set(rows.map(r=>r.sid));
    if(ga.dataset.ga==='open'){S.open=ids;S.closed=new Set()}else{S.open=new Set();S.closed=ids}
    document.getElementById('out').innerHTML=viewGroups(rows);return}
  const ls=e.target.closest('[data-ls]');
  if(ls){const k=ls.dataset.ls;if(S.listSort===k)S.listDir*=-1;else{S.listSort=k;S.listDir=1}update();return}
  const wm=e.target.closest('[data-wmore]');
  if(wm){S.weekMore.add(Number(wm.dataset.wmore));update()}
});
/* mobile sheet */
const sheet=document.getElementById('facets'),bg=document.getElementById('sheetBg');
const openSheet=o=>{sheet.classList.toggle('open',o);bg.classList.toggle('open',o);document.body.style.overflow=o?'hidden':''};
document.getElementById('fbtn').onclick=()=>openSheet(true);
document.getElementById('apply').onclick=()=>openSheet(false);
bg.onclick=()=>openSheet(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')openSheet(false);if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus()}});
window.addEventListener('hashchange',()=>{readHash();document.getElementById('q').value=S.q;renderStatic();update()});

/* init */
readHash();
document.getElementById('q').value=S.q;
renderStatic();
update();
</script>
